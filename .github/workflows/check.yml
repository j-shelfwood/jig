name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Repository consistency
        run: bun scripts/check.ts
      - name: Script tests
        run: bun test payload/claude/scripts
      - name: Hook tests
        run: bash payload/claude/hooks/tests/run-all.sh
      - name: Install site dependencies
        run: bun install --frozen-lockfile
      - name: Site tests (plugins and the landing-page generator)
        run: bun test site/src site/scripts
      - name: Build site
        run: bun run build
      - name: Site links
        run: bun site/scripts/check-links.ts
